const ANSWER_IDS = new Set(['A', 'B', 'C', 'D', 'X']);

};

function validateAnswers(answers) {
  if (!Array.isArray(answers) || answers.length !== QUESTIONS.length) {
    throw new Error('请先完成全部16道题。');
  }
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (!ANSWER_IDS.has(answers[i])) {
      throw new Error('这一题还没选，可以选择最接近的一项，或选“没遇到／不确定”。');
    }
  }
}

function findContrast(is) {
  const checks = [
    [is(2, 'C'), '你想帮着分析，对方却说只想吐槽。下次可以先确认对方想听哪一种回应。'],
    [is(9, 'A') && is(15, 'A'), '朋友更常给分析，你这次却更想有人陪你吐槽。你们想用的回应方式有点不同。'],
    [is(9, 'A') && is(15, 'C'), '朋友更常给分析，你这次却更想先把话说完。可以先说一句“先听我讲完”。'],
    [is(9, 'B') && is(15, 'B'), '朋友更常陪你骂，你这次却更想有人帮着想办法。下次可以直接告诉对方你想听什么。'],
    [is(7, 'B') && is(14, 'D'), '你描述自己会嫌麻烦但还是帮，对方有过明确不想帮的反应。仅凭这一次回应，还不知道拒绝的原因。'],
  ];
  const index = checks.findIndex(([matches]) => matches);
  return index === -1 ? null : { id: 'C' + (index + 1), text: checks[index][1] };
}

function roleAndShare(id, is, directions) {
  if (id === 'T2') {
    return is(8, 'B')
      ? { role: '你是画牢位，朋友是遛弯位。', share: '我画地为牢，你怎么还在遛弯。' }
      : { role: '你是遛弯位，朋友是画牢位。', share: '你画地为牢，我还在遛弯。' };
  }
  if (id === 'T4') {
    return { role: FIXED_ROLES.T4, share: is(10, 'B') ? '这顿我来，下顿记得叫我。' : TYPES.T4.share };
  }
  if (id === 'T5') {
    const { one, two } = directions.T5;
    if (one && two) return { role: '轮流起意，轮流应援。', share: '谁先说想试，另一个都能接上。' };
    if (one) return { role: '你想试试，朋友愿意支持。', share: '我一说想试，你就开始觉得能行。' };
    return { role: '你愿意支持朋友，见面时也会一起加项目。', share: '你一说想试，我就开始觉得能行。' };
  }
  if (id === 'T6') {
    const { one, two } = directions.T6;
    if (one && two) return { role: '轮流分析，轮流来聊聊。', share: '轮流告状，轮流做笔录。' };
    if (one) return { role: '你是班主任位，朋友是来聊聊位。', share: '你来告状，我怎么开始做笔录了。' };
    return { role: '你是来聊聊位，朋友是班主任位。', share: '我来告状，你怎么开始做笔录了。' };
  }
  return { role: FIXED_ROLES[id], share: TYPES[id].share };
}

function evaluateAnswers(answers) {
  validateAnswers(answers);
  const is = (number, id) => answers[number - 1] === id;
  const count = answers.reduce((n, id) => n + (id !== 'X' ? 1 : 0), 0);
  const fallbackEvidence = () => QUESTIONS.filter((q, index) => answers[index] !== 'X').slice(0, 2).map(q => {
    const optionId = answers[q.number - 1];
    return { id: q.id, number: q.number, prompt: q.prompt, optionId, answer: q.options.find(option => option.id === optionId).text };
  });
  const model = {
    version: META.version, status: '', title: '', titlePrefix: '', weakNote: '', message: '',
    matches: [], contrast: null, fallbackEvidence: [], shareText: '', tailnote: META.tailnote,
    validCount: count, internal: { eligible: [], topScore: null, directions: {} },
  };
  if (count < 10) {
    return { ...model, status: 'insufficient', title: '有些相处还不太确定', message: STATE_MESSAGES.insufficient, fallbackEvidence: fallbackEvidence() };
  }

  const directions = {
    T5: { one: is(3, 'A') && (is(6, 'A') || is(6, 'C')), two: is(13, 'A') && is(12, 'A') },
    T6: { one: is(2, 'A') && is(13, 'B'), two: is(9, 'A') && is(15, 'B') },
  };
  const eligible = [];
  const add = (id, necessary, score) => { if (necessary) eligible.push({ id, score }); };
  add('T1', is(8, 'A') && is(11, 'C'), (4 + Number(is(1, 'D')) + Number(is(4, 'D'))) / 6);
  if (is(8, 'B')) add('T2', is(1, 'A') || is(4, 'B'), (2 + Number(is(1, 'A')) + Number(is(4, 'B'))) / 4);
  if (is(8, 'C')) add('T2', is(1, 'B') || is(4, 'C'), (2 + Number(is(1, 'B')) + Number(is(4, 'C'))) / 4);
  add('T3', is(5, 'A') && is(11, 'A'), 1);
  add('T4', (is(10, 'A') || is(10, 'B')) && is(5, 'B'), 1);
  add('T5', directions.T5.one || directions.T5.two, (Number(is(3, 'A')) + Number(is(6, 'A') || is(6, 'C')) + Number(is(13, 'A')) + Number(is(12, 'A'))) / 4);
  add('T6', directions.T6.one || directions.T6.two, (Number(is(2, 'A')) + Number(is(13, 'B')) + Number(is(9, 'A')) + Number(is(15, 'B'))) / 4);
  add('T7', is(7, 'B') && is(14, 'B'), 1);
  add('T8', is(4, 'A') && is(16, 'A'), (2 + Number(is(1, 'C')) + Number(is(12, 'A') || is(12, 'B'))) / 4);
  eligible.sort((a, b) => b.score - a.score || Number(a.id.slice(1)) - Number(b.id.slice(1)));
  model.internal = { eligible: eligible.map(item => ({ ...item })), topScore: eligible[0]?.score ?? null, directions };
  const contrast = findContrast(is);
  if (!eligible.length) {
    return { ...model, status: 'unmatched', title: '这次还没拼出固定组合', message: STATE_MESSAGES.unmatched, contrast, fallbackEvidence: contrast ? [] : fallbackEvidence() };
  }

  // Compare the full ratios. No rounding is applied before the 0.08 cut-off.
  const winners = eligible.filter(item => eligible[0].score - item.score <= 0.08);
  const tied = winners.length > 1;
